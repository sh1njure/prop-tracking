<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Prop Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav-wrap">
  <div class="nav">
    <span class="brand"><span class="mark" aria-hidden="true">P</span>Prop Ledger</span>
    <div class="nav-links">
      <a href="#accounts">Accounts</a>
      <a href="#payouts">Payouts</a>
      <span class="updated" id="updated"></span>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="hero">
    <div class="hero-text">
      <p class="eyebrow">Net prop P&amp;L · <span id="year"></span></p>
      <h1 class="big num" id="net">$0</h1>
      <p class="lead" id="lead">Spent on accounts versus received in payouts.</p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="hero-card">
      <span class="hc-lbl">Total paid out</span>
      <span class="hc-val num" id="paid">$0</span>
      <span class="hc-sub" id="paid-sub">0 payouts</span>
      <div class="hc-rows" id="last-payouts"></div>
    </div>
  </section>

  <section class="block">
    <h2>Net over time</h2>
    <div class="card chart" id="chart"></div>
  </section>

  <section class="block">
    <h2>By firm</h2>
    <div class="card tbl" id="firms"></div>
  </section>

  <section class="block" id="accounts">
    <h2>Accounts</h2>
    <div class="card tbl" id="acc-table"></div>
  </section>

  <section class="block" id="payouts">
    <h2>Payouts</h2>
    <div class="card tbl" id="pay-table"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
